        // ファイルをアップロードする。
        function upload(fileNameStr, dataArry){

            // 現在の日付を取得
            const currentDate = new Date();
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, "0");
            const day = String(currentDate.getDate()).padStart(2, "0");

            // 配列データをCSV文字列に変換
            const csvData = dataArry.map(row => row.join(",")).join("\n");

            console.log("csvData= ",csvData);

            // ファイル名に日付を組み込む
            const fileName = fileNameStr + "_" + year + month + day + ".csv";

            // CSVデータをBlobに変換
            const blob = new Blob([csvData], { type: 'text/csv' });

            // フォームデータを作成
            const formData = new FormData();
            formData.append('file', blob, fileName); // Blobとしてファイルを追加
            formData.append('filename', fileName); // ファイル名を追加

            //console.log("formData= ",formData);            
        
            // CSVデータをサーバーへPOSTする
            if (uploadAccessPath) {
                fetch('/upload', {
                        method: 'POST',
                        body: formData
                    })
                .then(response => response.text())
                .then(data => {
                    console.log('Success:', data);      //成功時の処理
                })
                .catch((error) => {
                    console.error('Error:', error);     //エラー発生時の処理
                });
            } else {
                fetch('https://multi-touchcard.com/Recognition_rate_LSC/script/upload.php', {
                        method: 'POST',
                        body: formData
                    })
                .then(response => response.text())
                .then(data => {
                    console.log('Success:', data);      //成功時の処理
                })
                .catch((error) => {
                    console.error('Error:', error);     //エラー発生時の処理
                });
            }

            dataArry.length = 0;
        }    

        // ファイルとして保存する
        function download(fileNameStr, dataArry) {

            // 現在の日付を取得
            const currentDate = new Date();
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, "0");
            const day = String(currentDate.getDate()).padStart(2, "0");
            

            // 配列データをCSV文字列に変換
            const csvString = dataArry.map(row => row.join(",")).join("\n");

            // ファイル名に日付を組み込む
            const fileName = fileNameHeader + fileNameStr + "_" + year + month + day;      // ".json";

            // Blobオブジェクトを作成する            
            const blob = new Blob([csvString], { type: 'text/csv' });

            // Blob URLを作成する
            const url = URL.createObjectURL(blob);

            // <a>タグを作成する
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);

            // <a>タグをクリックする
            link.click();

            // URLを解放する
            URL.revokeObjectURL(url);

            dataArry.length = 0;
        }
